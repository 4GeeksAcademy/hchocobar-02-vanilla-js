<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Rigo with Vanilla.js</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css" integrity="sha384-hWVjflwFxL6sNzntih27bfxkr27PmbbK/iSvJ+a4+0owXq79v+lsFkW54bOGbiDQ" crossorigin="anonymous"/>
    <link rel="shortcut icon" href="./4geeks.ico" />
  </head>
  <body class="bg-success text-light">
    <div class="container-fluid">
      <h1 class="text-center my-4">Random Card Generator</h1>
      <div class="row d-flex justify-content-center">
        <div class="col-4 col-sm-3 col-xl-2 bg-light text-dark display-1 rounded">
          <div>
            <span id="up"></span>
          </div>
          <div class="text-center my-5">
            <span id="numbers"></span>
          </div>
          <div class="d-flex justify-content-end mb-1">
            <span id="down" style="transform: rotate(180deg)"></span>
          </div>
        </div>
      </div>
      <div class="d-flex justify-content-center mt-3">
        <button id="new-card" class="btn btn-warning">New Card</button>
      </div>
    </div>
  </body>
</html>
